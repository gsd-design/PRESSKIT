# Configuration Netlify : site statique, index.html à la racine, aucun build.
[build]
  publish = "."

# Cache long pour les médias. Si tu remplaces une image en gardant le même nom,
# vide le cache dans Netlify (Deploys → Trigger deploy → Clear cache and deploy).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# L'adresse technique Netlify renvoie vers le vrai domaine, pour que Google ne voie qu'un seul site.
[[redirects]]
  from = "https://presskitnolangsd.netlify.app/*"
  to = "https://nolangsd.fr/:splat"
  status = 301
  force = true
